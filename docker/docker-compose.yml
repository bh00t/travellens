version: '3.9'

services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: travellens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data:/data:ro
      - ../db:/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: travellens-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: travellens-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: travellens-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Airflow metadata database ─────────────────────────────────────────────
  # SEPARATE Postgres instance for Airflow's own metadata (DAG runs, task
  # instances, encrypted Connection objects). DELIBERATELY internal-only:
  # no `ports:` mapping, so it is not reachable from the host. Airflow's
  # orchestration state must never share a database with the warehouse.
  airflow-postgres:
    image: postgres:16
    container_name: travellens-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${AIRFLOW_POSTGRES_DB:-airflow}
      POSTGRES_USER:     ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready",
             "-U", "${AIRFLOW_POSTGRES_USER:-airflow}",
             "-d", "${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow (combined-image, LocalExecutor) ──────────────────────────────
  # Single container running scheduler + webserver + triggerer via the
  # `airflow standalone` command. Standalone is the right tool for this
  # portfolio scope — it is documented as dev/test only, which matches the
  # demo intent. For a production workload, split into scheduler/webserver/
  # triggerer services and bake providers into a custom Dockerfile (the
  # canonical list is in airflow/requirements-airflow.txt).
  #
  # Providers are installed at container start via _PIP_ADDITIONAL_REQUIREMENTS
  # to keep the image generic. This is slow on cold starts but acceptable here.
  airflow:
    image: apache/airflow:2.9.2
    container_name: travellens-airflow
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR:                 LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES:            "False"
      AIRFLOW__CORE__FERNET_KEY:               ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:          ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      # Providers installed at startup. Airflow itself ships in the image;
      # only providers go here. Canonical pinned list in
      # airflow/requirements-airflow.txt.
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        apache-airflow-providers-postgres==5.10.0
        apache-airflow-providers-amazon==8.20.0
      # Connection URIs — Airflow auto-imports any AIRFLOW_CONN_<id> env var
      # as a Connection object on startup. Conn IDs are derived from the
      # suffix, lowercased. Hosts use Docker DNS names (postgres, minio),
      # not localhost, because we're INSIDE the compose network here.
      AIRFLOW_CONN_TRAVELLENS_WAREHOUSE: ${AIRFLOW_CONN_TRAVELLENS_WAREHOUSE}
      AIRFLOW_CONN_TRAVELLENS_S3:        ${AIRFLOW_CONN_TRAVELLENS_S3}
    ports:
      - "8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
    name: docker_postgres_data
    external: true
  minio_data:
  airflow_postgres_data:
