<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img"
     aria-label="TravelLens pipeline: booking events stream through Kafka and a Python consumer into a Postgres + S3 dual sink, with an Ollama AI layer serving the Flask dashboard."
     font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity="0.035"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- White background + subtle grid -->
  <rect width="800" height="240" fill="#FFFFFF"/>
  <rect width="800" height="240" fill="url(#grid)"/>

  <!-- Title -->
  <text x="24" y="32" font-size="15" font-weight="800" fill="#0F172A">TravelLens India</text>
  <text x="24" y="50" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="9.5" letter-spacing="2.5" fill="#047857">NEAR-REAL-TIME PIPELINE · DATA FLOW</text>

  <!-- Connector lines between stages -->
  <g stroke="#94A3B8" stroke-width="1.2" fill="none">
    <line x1="117" y1="130" x2="150" y2="130"/>
    <line x1="250" y1="130" x2="283" y2="130"/>
    <line x1="383" y1="130" x2="417" y2="130"/>
    <line x1="517" y1="130" x2="550" y2="130"/>
    <line x1="650" y1="130" x2="683" y2="130"/>
  </g>

  <!-- Stages (filter adds subtle drop shadow) -->
  <g filter="url(#cardShadow)">
    <rect x="17" y="100" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="150" y="100" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="283" y="100" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="417" y="100" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
    <!-- AI layer: subtle purple tint so it reads as the "smart" stage -->
    <rect x="550" y="100" width="100" height="60" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="683" y="100" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
  </g>

  <!-- Stage labels -->
  <g>
    <text x="67" y="126" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Booking event</text>
    <text x="67" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#64748B" text-anchor="middle">create · cancel</text>

    <text x="200" y="126" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Kafka</text>
    <text x="200" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#64748B" text-anchor="middle">topic stream</text>

    <text x="333" y="126" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">consumer</text>
    <text x="333" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#64748B" text-anchor="middle">event-time tumble</text>

    <text x="467" y="126" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">dual sink</text>
    <text x="467" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#64748B" text-anchor="middle">Postgres + S3</text>

    <text x="600" y="126" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">AI layer</text>
    <text x="600" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#7C3AED" text-anchor="middle">text-to-SQL · pgvector</text>

    <text x="733" y="126" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">dashboard</text>
    <text x="733" y="144" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#64748B" text-anchor="middle">pinned widgets</text>
  </g>

  <!-- Three event dots flowing left-to-right, staggered -->
  <circle cy="130" r="4" fill="#059669">
    <animate attributeName="cx" values="-12;812" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="130" r="4" fill="#059669" opacity="0.6">
    <animate attributeName="cx" values="-12;812" dur="7s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cy="130" r="4" fill="#059669" opacity="0.35">
    <animate attributeName="cx" values="-12;812" dur="7s" begin="4.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Single, simple value caption -->
  <text x="24" y="210" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="10.5" fill="#64748B">events stream in   ·   pinned in seconds   ·   ask in English</text>
</svg>
