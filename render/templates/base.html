<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelLens India — {% block title %}{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --green: #00B140; --black: #000000; --white: #FFFFFF;
      --gray-50: #FAFAFA; --gray-100: #F4F4F5; --gray-200: #E4E4E7;
      --gray-500: #71717A; --gray-900: #18181B;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }
    nav {
      background: var(--black); color: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px; position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-family: var(--font-mono); font-size: .85rem; font-weight: 800; color: var(--green); letter-spacing: .05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { color: var(--gray-200); text-decoration: none; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; transition: color .15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); }
    .page { max-width: 1280px; margin: 0 auto; padding: 2rem; }
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 4px; font-size: .8rem; font-weight: 700; cursor: pointer; border: none; text-decoration: none; transition: all .15s; font-family: var(--font-sans); white-space: nowrap; }
    .btn-primary { background: var(--green); color: var(--white); }
    .btn-primary:hover { background: #007A2C; }
    .btn-ghost { background: transparent; color: var(--gray-500); border: 1px solid var(--gray-200); }
    .btn-ghost:hover { border-color: var(--gray-500); color: var(--gray-900); }
    .btn-danger { background: transparent; color: #dc2626; border: 1px solid #fca5a5; padding: .3rem .6rem; }
    .btn-danger:hover { background: #fef2f2; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1000; background: var(--black); color: var(--white); padding: .75rem 1.25rem; border-radius: 6px; font-size: .8rem; font-weight: 600; opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid #dc2626; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--gray-200); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  {% block extra_styles %}
  {% endblock %}
</head>
<body>
<nav>
  <a href="/dashboard" class="nav-brand">TravelLens India</a>
  <div class="nav-links">
    <a href="/dashboard" {% if active_page == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/explore"   {% if active_page == 'explore'   %}class="active"{% endif %}>Explorer</a>
    <a href="/monitor"   {% if active_page == 'monitor'   %}class="active"{% endif %}>Monitor</a>
    <a href="/about"     {% if active_page == 'about'     %}class="active"{% endif %}>About</a>
  </div>
</nav>
<div class="toast" id="toast"></div>
{% block content %}
{% endblock %}
<script>
  function showToast(msg, type) {
    type = type || 'success';
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(function() { t.className = 'toast'; }, 3000);
  }
</script>
{% block extra_scripts %}
{% endblock %}
</body>
</html>
